apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: outline-wiki
spec:
  selector:
    app: redis # i might return here to edit this
  ports:
  - port: 6379
    targetPort: 6379
  

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: outline-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis # i shall check this image later
        ports:
        - containerPort: 6379
        