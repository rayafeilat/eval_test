apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-outline
  namespace: outline-wiki
data:
  URL: http://localhost:30070
  REDIS_URL: redis://redis-service:6379
  COLLABORATION_URL: http://localhost:30070
  FORCE_HTTPS: "false"
  PORT: "3000"
  PGSSLMODE: disable
  
---

apiVersion: v1
kind: Service
metadata:
  name: nodeport
  namespace: outline-wiki
spec:
  type: NodePort
  selector:
    app: outline
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30070
---
apiVersion: v1
kind: Secret
metadata:
  name: outline-secret
  namespace: outline-wiki
type: Opaque
stringData:
  SECRET_KEY: 81cb15346b1ebd583ec565c5f391724b6929a75d6ea36ae4fc7b351e891ee8a9
  UTILS_SECRET: 4b239e7866c9cedef8e0c6d64b538a04a81c3fe59a4da473c4d7e4d884c2a202
  DATABASE_URL: postgresql://user:pass@postgres-service:5432/outline?sslmode=disable
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: outline-data
  namespace: outline-wiki
spec: 
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  
      
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-deployment
  namespace: outline-wiki
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outline
  template:
    metadata:
      labels:
        app: outline
    spec:
      containers:
      - name: outline
        image: outlinewiki/outline:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef: 
            name: configmap-outline
        - secretRef:
            name: outline-secret

