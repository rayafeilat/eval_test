apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: outline-wiki
type: opaque
stringData:
  POSTGRES_USER: user
  POSTGRES_PASSWORD: pass
  POSTGRES_DB: outline
  

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: outline-wiki
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: statefulset
  namespace: outline-wiki
spec:
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres-service
  replicas: 1
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:latest
        ports:
        - containerPort: 5432
          name: postgres
        envFrom:
        - secretRef:
            name: postgres-secret
        volumeMounts:
        - name: postgres-volume
          mountPath: /var/lib/postgresql
  volumeClaimTemplates:
  - metadata:
      name: postgres-volume
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
