apiVersion: apps/v1
kind: Deployment
metadata:
    name: outline
    namespace: outline-wiki
spec:
  replicas: 1
  selector:
   matchLabels:
     app: outline
  template:
    metadata:
      labels:
        app: outline
    spec:
      containers:
      - name: outline
        image: outlinewiki/outline:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: outline-config
        volumeMounts:
        - name: data
          mountPath: /var/lib/outline/data
        readinessProbe:
          httpGet:
            path: /_health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: outline-data

