      #here might add addtional keys not sure depends on the error
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: outline-deployment
  namespace: outline-wiki
spec:
  replicas: 1
  selector:
    app: outline
  template:
    spec:
      conatiners:
      - name: outline
        image: outlinewiki/outline:latest
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef: 
            name: configmap
        - secretRef:
            name: outline-secret
        volumesMounts:
          - name: data
            mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: outline-data







